name: Release

on:
  push:
    tags: ['v*']        # e.g. v1.2.0

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write       # needed to create the GitHub Release

env:
  PROJECT: MacDring.xcodeproj
  SCHEME: MacDring
  APP_NAME: "Top Drawer"
  ASSET_BASE: TopDrawer

jobs:
  test:
    name: Test before publishing
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      # Actions are pinned to immutable commit SHAs: a mutable tag like @v4 can be
      # repointed at tampered code after the fact, a commit SHA cannot. That matters
      # doubly here — this workflow holds contents:write and produces the exact bytes
      # the in-app updater ships to every user. Same pin-and-verify discipline
      # zai-code-review.yml already uses.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Neither job runs git after checkout; don't leave the workflow's
          # contents:write token sitting in .git/config for the whole build.
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '16.2'

      - name: Install xcbeautify
        run: brew install xcbeautify

      # A v* tag can land on any commit — including one CI never saw. The
      # in-app UpdateChecker offers every published release to every user,
      # so never publish a build whose tests didn't pass.
      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            clean test | xcbeautify

  release:
    name: Build & publish (unsigned)
    runs-on: macos-14
    timeout-minutes: 60
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # same rationale as the test job's checkout

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '16.2'

      - name: Install tooling
        run: brew install xcbeautify create-dmg

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build (Release, no Developer ID signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -destination 'generic/platform=macOS' \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Locate & ad-hoc sign the app
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release" -maxdepth 1 -name "$APP_NAME.app" -print -quit)
          [ -n "$APP" ] || { echo "::error::built $APP_NAME.app not found"; exit 1; }
          # Ad-hoc sign (identity "-"): no certificate, keychain, or API key required,
          # but it IS required for the app to launch on Apple Silicon. This is not a
          # Developer ID signature and the app is not notarized — Gatekeeper still warns.
          # (No --deep: it's deprecated, and this bundle has no nested code to sign.
          # If Developer ID ever lands, also add --options runtime and
          # --entitlements MacDring/MacDring.entitlements so Empty Trash keeps working.)
          codesign --force --sign - "$APP"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Package zip + DMG
        run: |
          ZIP="$RUNNER_TEMP/$ASSET_BASE-$VERSION.zip"
          DMG="$RUNNER_TEMP/$ASSET_BASE-$VERSION.dmg"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP"
          # create-dmg can exit non-zero on a headless runner even on success — verify the file.
          create-dmg \
            --volname "$APP_NAME $VERSION" \
            --window-size 540 380 \
            --icon-size 100 \
            --icon "$APP_NAME.app" 150 185 \
            --app-drop-link 390 185 \
            "$DMG" "$APP_PATH" || true
          [ -f "$DMG" ] || { echo "::error::DMG was not created"; exit 1; }
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ env.APP_NAME }} ${{ env.VERSION }}
          files: |
            ${{ env.DMG }}
            ${{ env.ZIP }}
          generate_release_notes: true
          body: |
            ### Unsigned build

            This app is **not** code-signed with a Developer ID or notarized, so macOS
            Gatekeeper will warn on first launch. To open it:

            - **Right-click** (or Control-click) the app → **Open** → **Open**, or
            - run `xattr -dr com.apple.quarantine "/Applications/${{ env.APP_NAME }}.app"`

      # Never trust an upload: download what GitHub actually serves for the tag and
      # byte-compare it against what was just built. A truncated or corrupt upload
      # would otherwise ship silently — and the in-app updater offers these exact
      # assets to every user.
      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/published"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/published"
          for f in "$ZIP" "$DMG"; do
            if ! cmp -- "$f" "$RUNNER_TEMP/published/$(basename "$f")"; then
              # The published copy provably differs from what was built: take it
              # down before failing, so the in-app updater can't keep serving
              # corrupt bytes while someone investigates.
              gh release delete-asset "$GITHUB_REF_NAME" "$(basename "$f")" -y || true
              echo "::error::published $(basename "$f") differed from the built artifact and was removed"
              exit 1
            fi
          done
