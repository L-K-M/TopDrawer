name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs. Added because GitHub throttled webhook delivery during an Actions
  # incident and pull_request events stopped starting workflows at all — dispatch
  # goes through the API instead and is unaffected. Useful beyond the outage too:
  # re-running CI no longer needs an empty commit.
  workflow_dispatch:

# Least privilege: the build/test job only needs to read the repo. Uploading test
# results uses the artifact API, which doesn't need extra token scopes.
permissions:
  contents: read

# Cancel an in-progress run when a branch is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: MacDring.xcodeproj
  SCHEME: MacDring

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-14
    # A wedged xcodebuild otherwise burns the 6-hour default job limit.
    timeout-minutes: 60
    steps:
      # Actions are pinned to immutable commit SHAs: a mutable tag like @v4 can be
      # repointed at tampered code after the fact, a commit SHA cannot. Same
      # pin-and-verify discipline zai-code-review.yml already uses.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here runs git after checkout

      # Before the 40-minute build, because this is a one-line answer. `editor-web.yml`
      # is path-filtered to EditorWeb/, so a Swift-only change to the bridge protocol
      # reaches no editor job at all and the two version pins can drift apart.
      - name: Check the notes-editor protocol versions agree
        run: scripts/check-notes-protocol-version.sh

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '16.2'   # pin so a runner-image bump can't change the toolchain

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Build & test
        run: |
          set -o pipefail
          # Tee the raw output as well: xcbeautify summarizes, and a summary of a
          # compiler error often omits the file and line it came from.
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            clean test 2>&1 | tee /tmp/xcodebuild.log | xcbeautify

      # The summarized output can hide which file failed to compile (it reports the
      # message, not always the location), so the raw log is what makes a red build
      # actionable from the run page alone.
      - name: Show compiler errors from the raw log
        if: failure()
        run: |
          if [ -f /tmp/xcodebuild.log ]; then
            grep -nE "error:" /tmp/xcodebuild.log | head -40 || true
            echo '--- last 40 lines ---'
            tail -40 /tmp/xcodebuild.log
          else
            echo 'no xcodebuild log was produced'
          fi

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore

      # The notes tab loads a web editor out of the app bundle. Xcode copies it in
      # with a build phase, and a silent failure there (a sandboxing change, a renamed
      # file, a phase dropped in a merge) would leave users with a blank notes drawer
      # that no unit test can see, so check the built product itself.
      #
      # The directory below is not free choice: it is the one
      # `NotesEditorSchemeHandler.bundledDirectory()` opens, and the app logs a
      # diagnostic and shows an empty drawer if the assets are anywhere else. Move
      # the two together or this check stops meaning anything.
      - name: Verify the notes editor shipped in the app bundle
        run: |
          set -euo pipefail
          # -print -quit rather than piping to head: a pipe would let find die of
          # SIGPIPE, which `set -o pipefail` turns into a failed step.
          app=$(find ~/Library/Developer/Xcode/DerivedData -maxdepth 6 -name 'Top Drawer.app' -path '*Build/Products*' -print -quit)
          test -n "$app" || { echo 'error: built app not found'; exit 1; }
          echo "app: $app"
          for asset in editor.html editor.js editor.css; do
            path="$app/Contents/Resources/EditorWeb/$asset"
            test -s "$path" || { echo "error: missing or empty $path"; exit 1; }
            echo "ok: $asset ($(wc -c < "$path") bytes)"
          done
