name: GLM 5.3 PR Review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write

# One review per PR at a time; superseded reviews of an outdated diff are
# worthless, so cancel them. Keyed on the PR number — for pull_request_target
# github.ref is the base branch, which would collide across PRs.
concurrency:
  group: zai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review PR with GLM 5.3
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # pull_request_target exposes repository secrets and a write-capable token.
    # Never run this privileged job for branches from untrusted forks.
    if: >-
      ${{ github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - name: Z.ai Code Review
        if: ${{ env.ZAI_API_KEY != '' }}
        # Pin privileged third-party actions to an immutable commit.
        # 7ab5aaf = v0.0.11. Verify before bumping:
        #   git ls-remote https://github.com/L-K-M/zai-code-review 'refs/tags/v0.0.11^{}'
        uses: L-K-M/zai-code-review@7ab5aafff29720d11502a1ccfdc442ad09634e24
        with:
          ZAI_API_KEY: ${{ env.ZAI_API_KEY }}
          ZAI_MODEL: glm-5.3
          ZAI_REASONING_EFFORT: high
          ZAI_MAX_OUTPUT_TOKENS: 32768
          ZAI_REQUEST_TIMEOUT_SECONDS: 900
          MAX_CHUNK_CHARS: 25000
          ZAI_REVIEWER_NAME: GLM 5.3 Code Review
          GITHUB_TOKEN: ${{ github.token }}

      - name: Skip when Z.ai API key is unavailable
        if: ${{ env.ZAI_API_KEY == '' }}
        run: echo "Skipping Z.ai review because ZAI_API_KEY is not configured."
